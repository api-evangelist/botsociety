name: BotSociety
description: >-
  Botsociety is a tool to design, preview, and prototype conversational interfaces — chatbots and
  voice assistants — before they are built. Its API lets applications retrieve the content of a
  design (messages, intents, variables, and integration data) at runtime, so bot content can be
  updated in the design tool without redeploying bot code. The API exposes design retrieval plus a
  legacy apisociety 2.0 surface for managing conversations, messages, and variables, authenticated
  with a user id and a public API key sent as request headers. Botsociety, backed by 500 Global,
  is winding down ("working on a new direction") and its API host is presently unreachable; the
  artifacts in this repo are reconstructed from the official first-party npm client and public API
  documentation. Surfaced originally as a 500 Global portfolio company and enriched into the API
  Evangelist network.
